<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Telegram Preview Clone</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    padding:40px;
}

.og-box{
    max-width:500px;
    background:#fff;
    border:1px solid #e5e5e5;
    border-radius:20px;
    padding:20px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
}

.domain{
    color:#666;
    font-size:18px;
    margin-bottom:10px;
}

.title{
    font-size:42px;
    font-weight:700;
    line-height:1.1;
}
</style>
</head>
<body>

<div class="og-box">
    <div class="domain">t.me</div>
    <div class="title">Telegram: Join Group Chat</div>
</div>

</body>
</html>
